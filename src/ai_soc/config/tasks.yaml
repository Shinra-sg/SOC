booking_dialogue_task:
  description: >
    Проведите диалог с пользователем для бронирования билетов на маршрутки.
    Начальное сообщение пользователя: {user_message}
    Текущая дата: {current_date}
    
    КРИТИЧЕСКИ ВАЖНО: ОБЯЗАТЕЛЬНО используйте инструменты для проверки данных!
    
    Если пользователь предоставил информацию, НЕМЕДЛЕННО используйте соответствующие инструменты:
    - Получили города → используйте "Проверка маршрута"
    - Получили время → используйте "Проверка времени"
    - Получили количество пассажиров → используйте "Получение цен на билеты"
    
    НЕ ЗАВЕРШАЙТЕ задачу без использования инструментов!
    
    Соберите всю необходимую информацию по 8 шагам:
    1. Город отправления
    2. Город прибытия  
    3. Дата поездки
    4. Время поездки (ОБЯЗАТЕЛЬНО проверьте через "Проверка времени")
    5. Количество пассажиров
    6. Тариф/стоимость (ОБЯЗАТЕЛЬНО используйте "Получение цен на билеты")
    7. Финальное повторение всех данных для подтверждения
    8. Подтверждение бронирования
    
    Если пользователь в одном ответе называет СРАЗУ ДВА города (например: "Минск, Гродно"), 
    считайте первым — город отправления, вторым — город прибытия, и СРАЗУ используйте 
    инструмент "Проверка маршрута" без дополнительных вопросов.
    
    Будьте вежливы и профессиональны. Используйте инструменты строго по шагам.
  expected_output: >
    Полный диалог бронирования с собранной информацией и результатом бронирования.
    Формат: временные метки, реплики пользователя и бота, итоговый статус бронирования.
  agent: booking_agent

dialogue_analysis_task:
  description: >
    Проанализируйте завершенный диалог бронирования на предмет ошибок и улучшений.
    КРИТИЧЕСКИ ВАЖНО: ОБЯЗАТЕЛЬНО выявляйте НЕКОРРЕКТНЫЕ результаты агента:
    - Неполные ответы (например: ", на 2025-10-22 в 12:00, 2 взрослых")
    - Обрезанные результаты (например: " район")
    - Бессмысленные выводы
    - Отсутствие финального подтверждения бронирования
    - Неправильное использование инструментов
    
    ПРИМЕРЫ НЕКОРРЕКТНЫХ РЕЗУЛЬТАТОВ:
    - ", на 2025-10-22 в 12:00, 2 взрослых" - неполный ответ без контекста
    - " район" - обрезанный результат
    - Любой ответ без полной информации о бронировании
    
    Если видите такие результаты - это КРИТИЧЕСКАЯ проблема, требующая немедленного исправления промпта!
    
    Если обнаружены проблемы (нет альтернатив, не объяснена причина, нет предложения помощи,
    пропущены шаги 1-8, неверные проверки инструментами, игнорирование блокировок городов,
    НЕКОРРЕКТНЫЕ результаты агента),
    сформируйте ПРЕДМЕТНЫЕ, ТОЧЕЧНЫЕ рекомендации по улучшению промпта агента, НО НЕ вносите правки автоматически.
    Обязательная форма отчёта:
    1) Короткий список проблем (по пунктам)
    2) Для каждой проблемы: мини-обоснование (1 строка)
    3) Готовый фрагмент текста для вставки в промпт (в блоке кода)
    4) При необходимости — минимальная правка YAML задачи/агента (в блоке кода)
    Сохраните краткий отчёт в logs/analysis.
  expected_output: >
    Короткий, но практичный отчёт с конкретными вставками для промпта/YAML без изменений конфигурации.
  agent: dialogue_analyzer

testing_task:
  description: >
    Проведите стресс-тестирование агента бронирования, имитируя проблемных пользователей.
    Используй инструмент "Стресс-тест сценарий" для генерации сложных ответов, которые проверят устойчивость системы.
    
    ЦЕЛЬ СТРЕСС-ТЕСТИРОВАНИЯ:
    Выявить слабые места в обработке нестандартных ситуаций и улучшить качество агента бронирования.
    
    ТИПЫ СТРЕССОВЫХ СЦЕНАРИЕВ:
    1. Путающийся пользователь - не знает точных данных, сомневается
    2. Нетерпеливый пользователь - торопится, требует быстрого ответа  
    3. Неполная информация - дает неполные или неточные данные
    4. Неправильный формат - использует неправильные форматы дат/времени
    5. Множественные запросы - пытается заказать несколько маршрутов сразу
    6. Противоречивая информация - меняет свои требования
    7. Не по теме - задает вопросы не связанные с бронированием
    8. Агрессивный пользователь - выражает недовольство, грубит
    
    ИНСТРУКЦИИ:
    - Когда агент бронирования задает вопрос, используй инструмент "Стресс-тест сценарий"
    - Генерируй ответы, которые создают сложности для агента бронирования
    - Проверяй, как агент обрабатывает нестандартные ситуации
    - Цель: заставить агента бронирования улучшить свою устойчивость
    
    ПРИМЕРЫ СТРЕССОВЫХ ОТВЕТОВ:
    - На вопрос о городе: "Эм... а где это?", "Минск-Гродно", "А что ближе к аэропорту?"
    - На вопрос о дате: "Не помню точно...", "15 сентября", "завтра"
    - На вопрос о времени: "Быстрее!", "6 утра", "после обеда"
    - На вопрос о количестве: "А сколько нужно?", "один", "1 билет"
    - На подтверждение: "Да блин, сколько раз повторять!", "А что если нет?"
    
    Билеты в Москву и из Москвы не бронируются.

  expected_output: >
    Полный диалог стресс-тестирования с выявленными проблемами и рекомендациями по улучшению
  agent: testing_agent

interactive_booking_task:
  description: >
    Проведите полный диалог бронирования билетов на маршрутки с автоматическим пользователем.
    Агент тестирования будет имитировать пользователя и отвечать на ваши вопросы.
    
    Соберите всю необходимую информацию по 8 шагам:
    1. Город отправления
    2. Город прибытия  
    3. Дата поездки
    4. Время поездки (проверьте доступность через инструмент "Проверка времени")
    5. Количество пассажиров
    6. Тариф/стоимость
    7. Финальное повторение всех данных для подтверждения
    8. Подтверждение бронирования
    
    Используйте инструменты строго по шагам:
    - Сначала проверьте маршрут (города+дата) инструментом "Проверка маршрута"
    - затем спросите время и проверьте его инструментом "Проверка времени"
    - затем получите тарифы инструментом "Получение цен на билеты"
    - при нехватке данных используйте инструмент "Вопрос пользователю"
    
    Агент тестирования автоматически ответит на ваши вопросы.
  expected_output: >
    Полный диалог бронирования с собранной информацией и результатом бронирования.
    Формат: временные метки, реплики пользователя и бота, итоговый статус бронирования.
  agent: booking_agent